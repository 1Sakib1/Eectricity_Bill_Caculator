<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Electricity Bill Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f6f8fd 0%, #f1f6fd 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.05), 0 1px 3px rgba(0,0,0,0.05);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 font-sans text-gray-800">

    <div class="absolute top-4 right-4 z-50">
        <select id="langSwitch" class="bg-white border-2 border-blue-100 text-blue-800 text-sm rounded-xl focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 shadow-sm cursor-pointer font-semibold outline-none transition-all hover:border-blue-300">
            <option value="en">🇺🇸 English</option>
            <option value="es">🇪🇸 Español</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="bn">🇧🇩 বাংলা</option>
            <option value="hi">🇮🇳 हिन्दी</option>
        </select>
    </div>

    <div class="glass-card rounded-3xl w-full max-w-md overflow-hidden relative mt-8">
        <!-- Header -->
        <div class="bg-blue-600 p-8 text-white text-center relative overflow-hidden">
            <div class="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-blue-500 rounded-full opacity-50"></div>
            <div class="absolute bottom-0 left-0 -mb-4 -ml-4 w-16 h-16 bg-blue-700 rounded-full opacity-50"></div>
            
            <i class="fas fa-bolt text-4xl mb-3 text-yellow-300 animate-pulse"></i>
            <h1 id="appTitle" class="text-2xl font-bold mb-1 tracking-tight">Smart Bill Calculator</h1>
            <p id="appSubtitle" class="text-blue-100 text-sm opacity-90">Calculate your electricity costs instantly</p>
        </div>

        <!-- Form Content -->
        <div class="p-8">
            <form id="calcForm" onsubmit="calculateBill(event)">
                <div class="mb-6 relative">
                    <label id="usageLabel" for="units" class="block text-sm font-semibold text-gray-600 mb-2 uppercase tracking-wide">Electricity Usage</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-tachometer-alt text-gray-400 group-focus-within:text-blue-500 transition-colors"></i>
                        </div>
                        <input type="number" step="0.1" name="units" id="units" required min="0"
                               class="block w-full pl-11 pr-16 py-4 border-2 border-gray-100 rounded-2xl focus:ring-0 focus:border-blue-500 transition-all text-lg font-medium text-gray-700 bg-gray-50 focus:bg-white shadow-inner" 
                               placeholder="0.0">
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                            <span class="text-gray-400 font-semibold group-focus-within:text-blue-500 transition-colors">kWh</span>
                        </div>
                    </div>
                    <p id="errorMsg" class="text-red-500 text-sm mt-2 hidden flex items-center gap-1"><i class="fas fa-exclamation-circle"></i> <span></span></p>
                </div>

                <button type="submit" id="calcBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-2xl transition-all transform hover:-translate-y-1 active:scale-95 shadow-lg shadow-blue-600/30 flex justify-center items-center gap-2">
                    <i class="fas fa-calculator"></i> <span>Calculate Bill</span>
                </button>
                
                <button type="button" id="resetBtn" onclick="resetForm()" class="hidden w-full mt-3 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-3 px-6 rounded-2xl transition-all flex justify-center items-center gap-2">
                    <i class="fas fa-redo"></i> <span>Calculate Another</span>
                </button>
            </form>

            <!-- Result -->
            <div id="resultBox" class="mt-8 bg-green-50 rounded-2xl p-6 border border-green-100 animate-fade-in hidden">
                <div class="flex items-center justify-between mb-2">
                    <span id="totalLabel" class="text-green-800 font-semibold text-sm uppercase tracking-wide">Total Amount Due</span>
                    <i class="fas fa-check-circle text-green-500 text-xl"></i>
                </div>
                <div class="text-4xl font-black text-green-600">
                    <span class="text-2xl">$</span><span id="totalAmount">0.00</span>
                </div>
                <p id="basedOnLabel" class="text-green-700 text-sm mt-2 opacity-80">Based on <span id="basedOnUnits" class="font-bold"></span> kWh usage</p>

                <div class="mt-4 pt-4 border-t border-green-200/50">
                    <p id="breakdownLabel" class="text-xs text-green-800 font-semibold uppercase mb-2">Tier Breakdown</p>
                    <ul id="breakdownList" class="text-sm text-green-700 space-y-2 opacity-90">
                        <!-- Filled by JS -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
